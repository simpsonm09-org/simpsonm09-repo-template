# Tools for the template. `flint init` reconciles the linter pins under the
# Linters header. See https://github.com/simpsonm09-org/simpsonm09-repo-standard/blob/main/docs/linting.md

[tools]

# Task runner
"aqua:casey/just" = "1.58.0"

# CI linters
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"

# JVM toolchain
java = "temurin-25"
"aqua:gradle/gradle" = "9.1.0"

# Linters
"aqua:grafana/flint" = "0.22.14"
"aqua:pinterest/ktlint" = "1.5.0"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"

[tasks.test]
description = "Run the tests"
run = "gradle test"
